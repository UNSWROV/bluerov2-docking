coarse_approach:
  ros__parameters:
    use_sim_time: true

    kp_surge: 1.0
    kd_surge: 0.0      # pure-P surge: no braking needed before the standoff
    # rev 2026-07-23: trial dock_trial_145038 showed the sway loop over-driving a
    # swaying standoff (ROV amplitude 2.3x the dock, relative vel no better than
    # stationary), which kept the velocity-match handoff gate from ever latching.
    # Lower kp so the feedforward carries the dock motion and feedback only trims the
    # residual; add kd (was pure-P) to brake the overshoot. Retune from the next trial.
    kp_sway: 0.5
    kd_sway: 0.3
    kp_heave: 2.0
    kd_heave: 0.0
    kp_yaw: 1.0
    kd_yaw: 0.0
    v_max_surge: 0.3
    v_max_sway: 0.3
    v_max_heave: 0.4
    v_max_yaw: 0.5
    # surge capped at slope*(distance to dock), floored for the final creep and
    # ceilinged at v_max_surge: slows near the dock, bounds collision speed.
    approach_speed_slope: 0.12
    approach_speed_floor: 0.05

    # dock-velocity feedforward (rev 2026-07-22): sync to the swaying dock BEFORE the
    # handoff. ff_vel_max bounds the term (dock-relative); authority ramps 0 -> 1 as
    # range_to_standoff falls from ff_ramp_far_m to ff_ramp_near_m (noisy far, matters near).
    ff_vel_max: 0.25
    ff_ramp_far_m: 1.5
    ff_ramp_near_m: 0.3
    # rev 2026-07-23: cmd_vel is effort-like, not a velocity servo (measured plant gain
    # v_rov/cmd ~1.3-1.6 with ~240ms lag in trial damped_sway_150515). The ff feeds a
    # physical velocity, so it must be converted to command units or it over-drives by
    # the plant gain (ROV swung 2.5x the dock). ~1/gain; refine from the next trial.
    ff_velocity_gain: 0.6
    # velocity-match handoff gate: standoff-relative speed must be under this to latch.
    # NOTE (rev 2026-07-23): the signal is EMA of |d(rel_pos_body)/dt| off the FILTERED
    # pose, whose measurement noise floors it near ~0.08 m/s even when the true relative
    # velocity is ~0.02 (trial slow_sway_005334). 0.05 sat below the noise floor -> never
    # latched (READY 0%). 0.15 clears the noise while still blocking pathological motion;
    # at the slow 18s sway the position debounce already implies velocity match. Cleaner
    # fix (later): gate on the filter velocity STATE minus ROV odom velocity, then tighten.
    vel_match_m_s: 0.15

    target_frame: "map"
    aim_offset_in_dock: [0.0, 0.0, 0.0]
    standoff_distance_m: 1.0

    # handoff window = coarse's real pure-P accuracy (~5 cm)
    position_tol_m: 0.10
    axis_offset_tol_m: 0.08
    yaw_tol_rad: 0.10
    ready_debounce_cycles: 10

    degraded_gain_scale: 0.5
    control_rate_hz: 20.0
    max_pose_age_s: 1.0
    max_twist_age_s: 1.0
